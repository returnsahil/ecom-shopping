<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ecom Shopping â€” a JavaScript shopping demo."
    />
    <title>Everyday essentials | Ecom Shopping</title>
    <link rel="stylesheet" href="styles/store.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Ecom Shopping home"
        ><span class="brand-mark">e.</span> Ecom Shopping</a
      >
      <nav aria-label="Main navigation">
        <a href="index.html">Shop</a><a href="orders.html">Orders</a
        ><a href="checkout.html"
          >Cart <span class="cart-count" data-cart-count>0</span></a
        >
      </nav>
    </header>
    <main id="main" class="main">
      <section class="intro">
        <p class="eyebrow">THE EVERYDAY COLLECTION</p>
        <h1>Good finds.<br />Everyday prices.</h1>
        <p>
          Discover practical essentials for your home, wardrobe, and weekend.
        </p>
      </section>
      <section aria-label="Product catalog">
        <div class="catalog-toolbar">
          <label class="search-label"
            >Find something
            <input
              type="search"
              data-search
              placeholder="Search products or keywords" /></label
          ><button class="secondary" data-load-live>Load live catalog</button
          ><span class="muted" data-results></span>
        </div>
        <p class="status" role="status" data-status></p>
        <div class="products-grid" data-products></div>
      </section>
    </main>
    <footer>Ecom Shopping Â· A JavaScript demo store. No real purchases.</footer>
    <script type="module" src="scripts/catalog.js"></script>
  </body>
</html>
